name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch has current Rust and PipeWire, like the systems this targets.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git make rust clang pkgconf gettext libpipewire nodejs

      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Service tests
        run: make check

      - name: Lint
        run: |
          cargo fmt --manifest-path service/Cargo.toml --check
          cargo clippy --manifest-path service/Cargo.toml --all-targets --locked -- -D warnings

      - name: KWin script tests
        run: make check-script

      - name: Translations
        run: for po in po/*.po; do msgfmt --check --statistics -o /dev/null "$po"; done
