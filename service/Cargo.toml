description = "Mutes applications while all their windows are minimized (service part of MuteOnMinimize)"
license = "GPL-3.0-or-later"
repository = "https://github.com/BeleBob/MuteOnMinimize"
publish = false

[dependencies]
pipewire = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
